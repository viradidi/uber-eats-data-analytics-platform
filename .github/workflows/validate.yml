name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java for local Spark tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate JSON and notebook files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(
              p for p in Path(".").rglob("*")
              if p.is_file()
              and (p.suffix.lower() == ".json" or p.suffix.lower() == ".ipynb")
              and ".git" not in p.parts
          )
          failures = []
          for path in paths:
              try:
                  with path.open(encoding="utf-8") as stream:
                      json.load(stream)
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)

          print(f"Validated {len(paths)} JSON/notebook files.")
          PY

      - name: Compile Python source files
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          paths = sorted(Path(".").rglob("*.py"))
          failures = []
          for path in paths:
              if ".git" in path.parts:
                  continue
              try:
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)

          print(f"Syntax-checked {len(paths)} Python files.")
          PY

      - name: Compile Python code cells in notebooks
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          paths = sorted(Path("notebooks").rglob("*.ipynb"))
          failures = []
          checked = 0
          for path in paths:
              try:
                  notebook = json.loads(path.read_text(encoding="utf-8"))
                  for index, cell in enumerate(notebook.get("cells", [])):
                      if cell.get("cell_type") != "code":
                          continue
                      source = "".join(cell.get("source", []))
                      if not source.strip():
                          continue
                      try:
                          ast.parse(source, filename=f"{path} [cell {index}]")
                          checked += 1
                      except SyntaxError as exc:
                          failures.append(f"{path} [cell {index}]: {exc}")
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)

          print(f"Syntax-checked {checked} Python notebook code cells across {len(paths)} notebooks.")
          PY

      - name: Check Silver notebook portability
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebook_dir = Path("notebooks")
          files = sorted(
              p for p in notebook_dir.iterdir()
              if p.suffix.lower() in {".py", ".ipynb"}
              and p.name.startswith("Silver_")
          )
          failures = []
          for path in files:
              source = path.read_text(encoding="utf-8")
              if path.suffix.lower() == ".ipynb":
                  try:
                      notebook = json.loads(source)
                      source = "\n".join(
                          "".join(cell.get("source", []))
                          for cell in notebook.get("cells", [])
                      )
                  except Exception as exc:
                      failures.append(f"{path}: invalid notebook JSON: {exc}")
                      continue
              if "/Workspace/Users/" in source:
                  failures.append(f"{path}: personal workspace path must not be committed")
              if "abfss://bronze@ubereaststorage.dfs.core.windows.net/" in source and "BRONZE_ROOT" not in source:
                  failures.append(f"{path}: Bronze path must use configurable BRONZE_ROOT")
              if '.load(f"{BRONZE_ROOT}/' not in source:
                  failures.append(f"{path}: expected a load path built from BRONZE_ROOT")
              if 'dbutils.widgets.text("bronze_root"' not in source:
                  failures.append(f"{path}: missing bronze_root widget")
          if not Path("src/common/spark_utils.py").is_file():
              failures.append("src/common/spark_utils.py: shared helper is missing")
          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          print(f"Portability checks passed for {len(files)} Silver notebook exports.")
          PY

      - name: Check Gold notebook portability
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          py_path = Path("notebooks/Gold_Analytics.py")
          ipynb_path = Path("notebooks/Gold_Analytics.ipynb")
          py_source = py_path.read_text(encoding="utf-8")
          notebook = json.loads(ipynb_path.read_text(encoding="utf-8"))
          cells = [
              "".join(cell.get("source", []))
              for cell in notebook.get("cells", [])
              if cell.get("cell_type") == "code"
          ]
          notebook_source = "\n".join(cells)
          failures = []
          if "/Workspace/Users/" in py_source or "/Workspace/Users/" in notebook_source:
              failures.append("Gold notebook must not contain a personal workspace path")
          if "from src.gold.transformations import build_gold_outputs" not in py_source:
              failures.append("Gold notebook must use the shared transformation module")
          if "gold_run_audit" not in py_source:
              failures.append("Gold notebook must write run audit records")
          if failures:
              raise SystemExit("\n".join(failures))
          ast.parse(py_source, filename=str(py_path))
          print("Gold notebook portability checks passed.")
          PY

      - name: Parse PowerShell deployment scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $paths = Get-ChildItem -Path deployment -Filter "*.ps1" -Recurse -File
          $failures = @()
          foreach ($path in $paths) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $path.FullName,
                  [ref]$tokens,
                  [ref]$parseErrors
              ) | Out-Null
              foreach ($errorItem in $parseErrors) {
                  $failures += "{0}:{1}: {2}" -f $path.FullName, $errorItem.Extent.StartLineNumber, $errorItem.Message
              }
          }
          if ($failures.Count -gt 0) {
              $failures | ForEach-Object { Write-Error $_ }
              exit 1
          }
          Write-Host "PowerShell syntax checks passed for $($paths.Count) deployment scripts."

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run complete repository test suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results.txt

      - name: Upload test log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-validation-${{ github.run_id }}
          path: test-results.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Check API security configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")
          assert 'API_KEY = os.getenv("API_KEY")' in source, "API_KEY must come from the environment"
          assert "ubereats-demo-key-123" not in source, "Hard-coded demo key must not return"
          assert "API authentication is not configured" in source, "Missing-key fail-closed behavior is required"
          print("API key configuration guard passed.")
          PY
